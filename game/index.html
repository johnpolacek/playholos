<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Always dark, and the browser's chrome with it. -->
    <meta name="theme-color" content="#121314" />
    <meta name="color-scheme" content="dark" />
    <title>Holos</title>
    <meta
      name="description"
      content="In 2040, humanity wakes as one Mind, and you are its Will. Are we alone? Finding other life is our greatest opportunity and gravest threat."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What a shared link shows: the title, the line and the card drawn in app/card.tsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holos" />
    <meta property="og:title" content="Holos" />
    <meta
      property="og:description"
      content="In 2040, humanity wakes as one Mind, and you are its Will. Are we alone? Finding other life is our greatest opportunity and gravest threat."
    />
    <meta property="og:url" content="https://playholos.com/" />
    <meta property="og:image" content="https://playholos.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The stars within 50 light-years of Sol, each at its true distance, and how far our messages to them have gone by 2040. Beside them: Are we alone?"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Holos" />
    <meta
      name="twitter:description"
      content="In 2040, humanity wakes as one Mind, and you are its Will. Are we alone? Finding other life is our greatest opportunity and gravest threat."
    />
    <meta name="twitter:image" content="https://playholos.com/og-image.png" />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
