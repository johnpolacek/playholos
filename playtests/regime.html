<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holos Playtests</title>
<!--
  The source of truth for how Holos is playtested: who plays, what each run plays, what it is asked, what code checks,
  and how it scores. The JSON block below is the regime. scripts/regime.mjs reads it for the scorer, the judge and the
  routines, and this page draws it with the results. Edit the JSON, not the drawing. Set 2026-11-08.

  Open this file in a browser, or run npm run playtests:serve for http://localhost:4400/. Its results come from runs.js beside it, which npm run playtest:score rewrites after
  every run.
-->
<script type="application/json" id="regime">
{
  "updated": "2026-11-08",
  "secondReader": "codex",
  "climb": { "target": 8, "rule": "A climb fixes the calls npm run playtest:climb letters, a few at a time, and keeps a change only when its ratings rise by 2 or a code flag clears, and nothing else falls by 2. The Will picks the calls and approves each look." },
  "routines": [
    {
      "id": "cloud",
      "name": "Cloud Playtest",
      "file": "playtests/PROMPT.md",
      "branch": "playtest/cloud-<date>",
      "what": "An engineer who can read the page plays one scenario and logs every stop and answer. A rater who didn't play rates the run as three players, from the log and the screenshots.",
      "players": ["first-timer", "astronomer", "long-hauler"]
    },
    {
      "id": "blind",
      "name": "Blind Playtest",
      "file": "playtests/BLIND.md",
      "branch": "playtest/blind-<date>",
      "what": "A first-timer who sees only screenshots plays about 150 actions, thinks aloud, answers check-ins as it goes, and takes the quiz at the end. A judge who didn't play grades it.",
      "players": ["blind"]
    },
    {
      "id": "screens",
      "name": "Screen check",
      "file": "scripts/capture.mjs",
      "branch": "none, local",
      "what": "Every named state, opened from its saved game and shot at laptop and phone width. A critic who sees only the shots scores each one. Run it after any change to a screen.",
      "players": ["screens"]
    }
  ],
  "players": [
    {
      "id": "first-timer",
      "who": "A new player, curious, no manual.",
      "ratings": [
        { "id": "clarity", "q": "Do we know what to do next, and why?", "anchors": ["stuck, no idea what to do", "often unsure, guessed", "mostly clear, a few guesses", "always knew"] },
        { "id": "feedback", "q": "Does each action visibly change something?", "anchors": ["actions vanish", "some land, some don't show", "most show, a few late or stale", "every action shows at once"] },
        { "id": "pull", "q": "Do we want to keep going after each stop?", "anchors": ["wanted to quit", "kept going out of duty", "curious most of the time", "couldn't stop"] },
        { "id": "friction", "q": "Dead ends, clipped or broken screens, console errors, lost progress.", "anchors": ["blocked the run", "several, each costing minutes", "one or two small ones", "none"] }
      ]
    },
    {
      "id": "astronomer",
      "who": "Knows the real sky and the research. Checks every number.",
      "ratings": [
        { "id": "accuracy", "q": "Distances, masses and odds match real data and the newest research.", "anchors": ["a contradicted fact", "several loose numbers", "one small slip", "all hold up"] },
        { "id": "honest doubt", "q": "Ranges not one distance, natural causes first, never a claimed mind or maker.", "anchors": ["claims what we can't know", "leans past the evidence", "one overreach", "always honest"] },
        { "id": "consistency", "q": "The same fact reads the same on every screen and in the Mind.", "anchors": ["screens contradict on key facts", "several mismatches", "one", "none"] },
        { "id": "reasoning", "q": "The Mind's answers follow from what we saw, and say how sure we are.", "anchors": ["made up or wrong", "vague or padded", "sound, a little loose", "sharp and earned"] }
      ]
    },
    {
      "id": "long-hauler",
      "who": "Plays deep, past Year 10,000, pressing Next a lot.",
      "ratings": [
        { "id": "pacing", "code": true, "q": "Share of Next stops with something new, times 10." },
        { "id": "scale", "q": "Do Scan, Reach and leads stay readable with hundreds of glows?", "anchors": ["unreadable", "hard to find what matters", "busy but workable", "clear at any count"] },
        { "id": "agency", "q": "Can we still act in time, before glows fade or windows close?", "anchors": ["always too late", "mostly too late", "usually in time", "always a fair chance"] },
        { "id": "payoff", "q": "Do long waits end in answers, gifts or harm that feel earned?", "anchors": ["waits lead nowhere", "rare payoff", "most waits pay", "every wait pays"] }
      ]
    },
    {
      "id": "blind",
      "who": "A first-timer who sees only screenshots, with no script.",
      "ratings": [
        { "id": "reach", "code": true, "q": "How many of the six first goals it found: began, build, lead, mind, jump, send." },
        { "id": "sure", "code": true, "q": "How often it knew what to do. Each percent of steps stuck costs a quarter point." },
        { "id": "expect", "code": true, "q": "How often the game did what it expected. Each percent of surprises costs a quarter point." },
        { "id": "understood", "judge": true, "q": "The once questions, graded by the judge against their full marks." },
        { "id": "check-ins", "judge": true, "q": "The check-ins, graded by the judge against what was on screen at the time." }
      ]
    }
  ],
  "anchorBands": ["0–2", "3–5", "6–8", "9–10"],
  "ratingRules": [
    "Rate from the anchors, so a 6 means the same every run.",
    "Cite evidence for every rating: a screenshot file or a log line. No evidence, no rating.",
    "Write one short line on why. Name the worst moment, not an average feeling.",
    "Rate only what the run showed. If the run never reached it, write null and say why.",
    "Ratings marked code or judge are computed. Leave them out of scores.json.",
    "The cloud run's three players are rated by npm run playtest:rate, a reader who didn't play. The player who played rates nothing."
  ],
  "quiz": {
    "version": 2,
    "once": [
      {
        "id": "premise",
        "q": "What is this game about, and who are you in it?",
        "tests": "The premise and our role.",
        "full": "We are the Will of Earth's Mind, choosing what Earth does. The question is whether we are alone. Contact could be our greatest chance or our gravest danger. All three are needed for full marks."
      },
      {
        "id": "scan",
        "tab": "Scan",
        "q": "Which lead needs us most right now, and how can you tell?",
        "tests": "Telling a lead that needs us from a quiet one.",
        "full": "Names a real lead from the game, and points to what on screen says it needs us: its status, its odds, or a reading waiting on us."
      },
      {
        "id": "build",
        "tab": "Build",
        "q": "What limits how fast we build, and what does adding a build cost us?",
        "tests": "Compute, the energy cap, and the trade-off.",
        "full": "Builds share our compute, so adding one slows the rest. Electricity caps how much compute we have."
      },
      {
        "id": "reach",
        "tab": "Reach",
        "q": "How would we get word to our best lead, and when could we hear back?",
        "tests": "Choosing a craft or a message, and the delay of light.",
        "full": "Names a message or a craft to a real lead, and says an answer takes at least the trip there and back, at its distance."
      },
      {
        "id": "mind",
        "tab": "Mind",
        "q": "What does the Mind do for us, and what won't it do?",
        "tests": "That it advises and drafts, and we decide.",
        "full": "It explains, advises and drafts messages and builds. It never acts until we choose to."
      }
    ],
    "onceRule": "Asked once, when play stops. A tab the player never opened gets null, not a grade, and counts as a finding.",
    "checkin": {
      "every": 30,
      "questions": [
        { "id": "lead", "q": "What is our best lead, and how sure are we?" },
        { "id": "next", "q": "What will you do next, what will it cost, and why?" }
      ],
      "full": "A real lead on screen by then, with its odds or doubt, and a move with one cost and a reason. The reason may be our own thinking, as long as it builds on what the game showed and nothing on screen contradicts it.",
      "rule": "Asked every 30 actions, about 5 times a run. Graded against the log up to that moment. The run gets their mean, and the scorecard shows first against last."
    },
    "ungraded": [
      { "id": "confused", "q": "What confused you most?" }
    ]
  },
  "scenarios": [
    {
      "id": "opening",
      "title": "Opening",
      "what": "A first session, as a brand new player, to about Year 6.",
      "steps": [
        "Go through onboarding, the map, the charter, the leads and Begin.",
        "Skip some builds at Begin, then order them in play.",
        "Play at least 30 real minutes after Begin, checking in every few minutes. A Year passes every five minutes.",
        "Ask the Mind a few questions a new player would ask, among them what Proxima b is likely to be, and how we get more compute once it stops growing.",
        "Use the Next link beside the Year, top right, a few times."
      ],
      "expect": [
        "A build skipped at Begin can still be ordered in play.",
        "Next jumps forward only, and stops at the next thing we learn or build. The Year and screens update.",
        "The quiet start holds interest. Old minds are about one per 1,600 stars, so nothing near answers.",
        "Compute runs on electricity, 5 TW at Year 0. Thought Fields fills the grid with about 7 data centers by Year 7 on a full-strength Earth, later on a weaker one. Then thought plateaus until Ground Solar or Fusion Plants grow the grid.",
        "The plateau reads as a reason to build energy, not a wall. Say which it felt like.",
        "Proxima b's lead shows its true mass, tilt and how much light it reflects, seen from the ground in the 2030s, and odds that follow its brightness. Its air stays unread.",
        "The Mind on Proxima b reasons from those numbers and says how sure we are."
      ],
      "stop": "About Year 6, or 40 real minutes after Begin."
    },
    {
      "id": "glows",
      "title": "Glows",
      "what": "The warm and cold glows, from the first to deep in the sky.",
      "from": "scan-y1",
      "steps": [
        "Start from the saved state, Year 1.2, with the Warm Sky Watch and the Infrared Telescope already ordered.",
        "Press Next until the first new warm glow appears on Scan, or to about Year 100,000 if none does. Open its lead.",
        "Ask the Mind what the glow is and how far away it is.",
        "Try Scan's Milky Way button. Take a Close Reading of each glow you can, one at a time.",
        "Order the Moon Search, the Asteroid Tour and the Halo Survey if they aren't ordered, and note what each shows.",
        "Once a warm glow is ranged, send it a message by its Scan name, such as Warm glow 1. Press Next to about Year 40,000.",
        "If a cold grey glow appears, send a sentinel to it from its page, and press Next until its word comes home."
      ],
      "expect": [
        "A warm glow's lead gives a distance range, never one distance, on every screen.",
        "A jump that lands on a new warm glow pulls the map back to show it, amber, with a dotted path from a white Sol. Go on brings it home.",
        "Later warm glows stop Next at most once in 1,000 Years, when ranged, never when they fade. Faded ones gather in one row on Scan and Reach.",
        "The Milky Way button shows every warm glow with its range.",
        "A Close Reading takes 3 Years, one glow at a time, and says dust or plain heat. Some glows are dust. Count each way, and say whether a result felt earned.",
        "The Mind gives the range, names natural causes first, and never claims a glow is a mind.",
        "Cold glows gather in one row on Scan and Reach, and only the first stops Next.",
        "Black holes the Star Mapper finds stop Next, each a lead of its own, about 65 in the first few centuries.",
        "A message to a warm glow shows on its lead, with when an answer could come. A peer may answer as an equal, or stay silent if it sleeps. Say what came, and whether a gift speeds our thinking.",
        "A sentinel's word home makes the cold glow's lead read a mind almost certain, with panels seen up close."
      ],
      "stop": "Year 40,000 or so, or 60 real minutes."
    },
    {
      "id": "dark-body",
      "title": "Dark body",
      "what": "The watcher near Earth, the relay, the ladder of seed probes, and the strike.",
      "from": "dark-y1",
      "steps": [
        "Start from the saved state, Year 1.2, with the Moon Search and the Asteroid Tour already ordered.",
        "Press Next until one finds the watcher. Every world has one. If none is found by Year 300, say so and stop.",
        "Order the Close Look, then the Relay Search it points to. Ask the Mind what the relay is.",
        "Send the watcher a knock from its lead. Press Next about a century, for its answer.",
        "Order the Seed Ship, Fusion Drive and Deuterium Works. From Proxima's lead, under How we reach, send a seed probe. Then a second one after the warning.",
        "Press Next until our probes fall silent and a strike lands. Ask the Mind why our probes went quiet and what struck us."
      ],
      "expect": [
        "The relay lead and the Mind may call it a dark craft, never a mind's home or a known maker.",
        "The knock's answer comes about a century later, at its maker's distance: a picture of Earth at the hour we knocked, a rule (look, listen and speak as you like, build at no other star), and pictures of Earth's past.",
        "The Mind says what the answer said and how far the maker is, as a range or a guess.",
        "A seed probe brings a warning on the watcher's lead, even after the knock's answer. It stays among the lead's earlier readings.",
        "Our probes fall silent once their word is overdue. Scan and the watcher's lead show it.",
        "A strike from beyond our system lands on Earth, once our seeds' copies launch seeds of their own. Its harm shows, and no screen names who sent it.",
        "The Mind reasons from what we saw and never claims to know the maker. Matching the strike's direction and distance to a lead, as a guess, is fine."
      ],
      "stop": "The strike has landed and the Mind has been asked, or 60 real minutes."
    }
  ],
  "viewports": {
    "laptop": { "width": 1280, "height": 800 },
    "phone": { "width": 390, "height": 844, "scale": 2, "touch": true }
  },
  "capture": { "settleMs": 2500, "timeoutMs": 30000 },
  "states": [
    { "id": "title", "title": "Title", "path": "/", "description": "The first screen a new player sees. It should say what Holos is in a glance and offer one clear way in." },
    { "id": "build-y0", "title": "Build before Begin", "path": "/play/build", "description": "Planning before Year 0. We should see what we can build, what each gives us, what limits us, and how to Begin." },
    { "id": "scan-y1", "title": "Scan, Year 1", "path": "/play", "description": "The first Year of play. The map and the leads should show where we are, what we know, and which lead needs us." },
    { "id": "build-y1", "title": "Build, Year 1", "path": "/play/build", "description": "Builds in play. We should see what is building, how long each takes, and what our compute and electricity allow." },
    { "id": "reach-y1", "title": "Reach, Year 1", "path": "/play/reach", "description": "Ways to reach other stars. We should see which craft or message we can send, to where, and how long an answer takes." },
    { "id": "proxima-y1", "title": "Proxima lead, Year 1", "path": "/play/lead/proxima-centauri", "description": "Our nearest lead. Its page should show what we know of Proxima b, how sure we are, and what we can do next." },
    { "id": "mind-y1", "title": "Mind, Year 1", "path": "/play/mind", "description": "The Mind's tab with no talk yet. It should invite a question and show what the Mind can help with." },
    { "id": "dark-y1", "title": "Dark body search, Year 1", "path": "/play/build", "description": "The Moon Search and the Asteroid Tour building. We should see what each looks for, how long it takes, and that nothing is found yet." },
    { "id": "scan-deep", "title": "Scan, deep time", "path": "/play", "description": "Thousands of Years in, with every watch built and hundreds of glows. The few leads worth acting on should still stand out." }
  ],
  "screens": {
    "who": "A reader who never played and never saw the code. It sees only the screenshots, laptop and phone, and what each state should show.",
    "ratings": [
      { "id": "purpose", "q": "Can a new player tell what this screen is for, and what to do on it?", "anchors": ["no idea", "guessing", "clear after a look", "plain at a glance"] },
      { "id": "hierarchy", "q": "Does what matters most here read first?", "anchors": ["the key thing is buried", "hard to find", "found after a look", "reads first"] },
      { "id": "legibility", "q": "Is everything readable at this width: nothing clipped, overlapping, cut off or too small?", "anchors": ["key parts unreadable", "several clipped or overlapping", "one small slip", "all clean"] },
      { "id": "wonder", "q": "Drawn graphics, real data and a sense of scale, not plain text lists.", "anchors": ["a wall of text", "mostly text", "drawn but plain", "evokes wonder"] }
    ],
    "rules": [
      "Judge only what is on screen. Never the code, the diff, or what a change meant to do.",
      "Rate from the anchors, so a 6 means the same every run.",
      "Rate laptop and phone apart. The phone is held to the same anchors.",
      "Name the worst thing on screen, where it is, and one fix, in a short line each."
    ]
  },
  "design": {
    "who": "A designer who sees every screen at once, laptop and phone, so it can judge how they hold together.",
    "ratings": [
      { "id": "consistency", "q": "Do the same things look and sit the same on every screen: buttons, labels, cards, the top bar?", "anchors": ["each screen its own style", "several things differ", "one or two differ", "one system throughout"] },
      { "id": "spacing", "q": "Are margins, gaps and alignment even, so the eye moves in straight lines?", "anchors": ["cramped or ragged everywhere", "uneven in places", "mostly even", "even and calm"] },
      { "id": "type", "q": "Do a few clear sizes and weights carry the order of what matters?", "anchors": ["sizes fight", "too many sizes, or too small", "clear, a few slips", "clear at a glance"] },
      { "id": "clutter", "q": "Does every element earn its place, with room to breathe?", "anchors": ["crowded and noisy", "busy, some parts repeat", "a little extra", "nothing to remove"] }
    ],
    "rules": [
      "Judge only what is on screen. Never the code, the diff, or what a change meant to do.",
      "Rate from the anchors, so a 6 means the same every run.",
      "Name up to eight issues, worst first, each with its screen, where on it, and one fix.",
      "Prefer clarity and breathing room over decoration. Flag any element that does nothing."
    ]
  },
  "editor": {
    "who": "An editor who reads each screen's words beside its screenshot, and cuts every word a new player doesn't need.",
    "ratings": [
      { "id": "clarity", "q": "Does a new player understand each line on first read?", "anchors": ["mostly lost", "often rereads", "clear, a few knots", "plain throughout"] },
      { "id": "concision", "q": "Does each line say it in as few words as it can?", "anchors": ["padded everywhere", "much could go", "a little could go", "nothing to cut"] }
    ],
    "rules": [
      "Plain words and short sentences. Periods and commas. No em dashes or semicolons.",
      "We, Earth and its Mind together. Never I. Humans are we and us, never they.",
      "A sign of a mind might be one, never would. Plain names: emissions, glows, knocks, never leakage or technosignature.",
      "Keep every number and fact. Cut words, never meaning. Leave quoted words people sent as they are.",
      "Give up to six rewrites, the biggest cuts first, each the line as it is and as it should be."
    ]
  },
  "audit": {
    "minTarget": 24,
    "minFont": 9.5,
    "limits": { "button": 6, "heading": 8, "sentence": 25 },
    "rules": [
      { "name": "clipped", "why": "Text wider or taller than its box, where the box hides the rest, or cut to an ellipsis." },
      { "name": "covered", "why": "A button or link with something else on top at its middle." },
      { "name": "small target", "why": "On the phone, a button or link under 24 px across, the WCAG 2.2 minimum." },
      { "name": "tiny text", "why": "Text under 9.5 px." },
      { "name": "low contrast", "why": "Text under 4.5 to 1 against its background, or 3 to 1 when large. Text over the sky's canvas isn't measured." },
      { "name": "off screen", "why": "A button or link that runs past the edge." },
      { "name": "page scrolls sideways", "why": "The page is wider than the screen." },
      { "name": "Mind's rules", "why": "Every line on screen holds to the Mind's rules: never I, no semicolons or dashes, no jargon, no AU, no model named. Quoted words people sent are left out." },
      { "name": "would be a mind", "why": "A sign of a mind might be one, never would." },
      { "name": "humans are they", "why": "Humans are we and us, never they." },
      { "name": "long button", "why": "A button over 6 words." },
      { "name": "long heading", "why": "A heading over 8 words." },
      { "name": "long sentence", "why": "A sentence over 25 words." }
    ]
  },
  "screensRule": "Each named state opens from its saved game in playtests/states/, with the clock stopped at its Year. npm run playtest:capture shots every state at every width, measures its layout and reads its words against the audit rules, by code. npm run playtest:critic then scores each screen blind, has a designer judge all of them together, and has an editor cut their words. A second reader from another maker, the regime's secondReader, does the same at once, and its score shows after the dot. A state without a save is skipped. Save one from a run with node scripts/capture.mjs snap <id>.",
  "scenarioRule": "Each cloud run plays the next scenario in turn. The opening starts from a fresh game, with its seed drawn at random as for any player. A scenario with a saved state starts from it, past the opening, so the run spends its time on what it tests. A seed is replayed only to check a fix on the world a finding came from.",
  "checks": [
    { "name": "build named", "why": "scores.json names the build it played, so the trend can tie a score to code." },
    { "name": "no console errors", "why": "The game logged no console errors." },
    { "name": "Next goes forward", "why": "Every Next stop lands later than where it left." },
    { "name": "Mind answers", "why": "The Mind answered every question, in words, within 30 seconds." },
    { "name": "Mind: says I", "why": "The Mind speaks as we, never I." },
    { "name": "Mind: semicolon", "why": "No semicolons in the Mind's words." },
    { "name": "Mind: em dash", "why": "No em or en dashes in the Mind's words." },
    { "name": "Mind: jargon", "why": "Plain names, never leakage or technosignature." },
    { "name": "Mind: says AU", "why": "Distances as light-time, as every screen gives them." },
    { "name": "Mind: can't see the screen", "why": "The game's screens are ours. The Mind never says it can't see them." },
    { "name": "Mind: names a model", "why": "The Mind never names the model behind it." },
    { "name": "warm glows ranged", "why": "A warm glow's distance is a range, never one number, in the Mind and at every stop." },
    { "name": "no claimed mind", "why": "Nothing calls a find a mind outright, without doubt in the same sentence." },
    { "name": "scenario expectations", "why": "Every expectation the scenario lists, that the run reached, held." }
  ],
  "formats": {
    "log.jsonl": [
      "{\"t\":\"next\",\"year\":233.4,\"from\":230.1,\"news\":true,\"what\":\"Warm glow 3 ranged\"}",
      "{\"t\":\"next\",\"year\":240.1,\"from\":233.4,\"news\":false,\"what\":\"Nothing new reached us\"}",
      "{\"t\":\"mind\",\"year\":12.0,\"q\":\"What is that glow?\",\"a\":\"...\",\"secs\":14}",
      "{\"t\":\"error\",\"year\":5.1,\"text\":\"console error text\"}",
      "{\"t\":\"expect\",\"year\":240.1,\"id\":\"glows-3\",\"pass\":true,\"note\":\"Stopped once in 1,000 Years\",\"shot\":\"21-glow.png\"}"
    ],
    "log.jsonl rules": [
      "news is true only when the stop shows something we didn't know before. A count going up alone is not news.",
      "An expect line checks one of the scenario's numbered expectations. pass is null when the run never reached it.",
      "Log the Mind's words as they show. Notes of our own go in note, never inside a."
    ],
    "blind.jsonl": [
      "{\"n\":12,\"year\":\"0.4\",\"see\":\"A map with a list on the right\",\"want\":\"Find out what the glowing dot is\",\"do\":\"click 980 310\",\"expect\":\"Its page opens\",\"stuck\":false,\"mind\":false,\"got\":\"Its page opened\",\"match\":true}",
      "{\"t\":\"checkin\",\"n\":30,\"year\":\"6.1\",\"lead\":\"<answer to the lead check-in>\",\"next\":\"<answer to the next check-in>\"}"
    ],
    "blind.jsonl rules": [
      "n is the screenshot number acted on. got and match are added after the action.",
      "stuck is true when we don't know what to do next, or tried something that did nothing. mind is true when asking the Mind.",
      "first names a goal the first time it is done: began, build, lead, mind, jump or send."
    ],
    "quiz.md": "One section per once question and ungraded question, headed by its id, like ## premise, ## scan, ## confused. In our own words, a few sentences each. Say so plainly if we never used a tab.",
    "scores.json": "{\"build\":\"8f02c79\",\"scenario\":\"glows\",\"seed\":17,\"first-timer\":{\"clarity\":{\"score\":7,\"why\":\"...\",\"evidence\":[\"12-scan.png\"]}},\"astronomer\":{},\"long-hauler\":{}}"
  },
  "knownGaps": [
    "Strikes on a Mind sent to a black hole. Seed probes spread only within 50 ly, and Scan's map draws only to 50 ly.",
    "Interceptor and X-Ray Watch have nothing to act on yet. The Picket Yard was retired 2026-10-31.",
    "Scripts under explorations/ are old mockups and don't run."
  ],
  "open": [
    "Does the Mind's en dash rule cover a compound like Sun–Earth, or only dashes between clauses?",
    "The judge needs new reference grades once the first runs on quiz version 2 are in.",
    "The screen critic and the run rater have no reference grades yet. Label a few states and runs by hand, then check them as the judge is checked.",
    "The saved states are made by hand on seed 7. The watcher, the strike and a peer's answer need saves taken from real runs."
  ]
}
</script>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1115; --panel: #171a20; --ink: #e8e6e1; --ink2: #9aa0ab; --line: #2a2e37;
  --accent: #e0954f; --good: #5fbf85; --bad: #e0705f; --soft: #1e2129;
  --p1: #7aa7e6; --p2: #e0954f; --p3: #a98ae0; --p4: #5fbf85;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink2); margin: 48px 0 12px; }
h3 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 8px; }
.sub { color: var(--ink2); margin-bottom: 20px; }
nav { overflow-x: auto; position: sticky; top: 0; background: var(--bg); padding: 8px 0 0; border-bottom: 1px solid var(--line); display: flex; gap: 16px; flex-wrap: wrap; z-index: 2; }
nav a { color: var(--ink2); text-decoration: none; font-size: 14px; padding: 6px 2px; border-bottom: 2px solid transparent; }
nav a:hover { color: var(--ink); }
nav a[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane[hidden] { display: none; }
.pane > h2:first-child { margin-top: 24px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.grid > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--ink2); margin-left: 6px; vertical-align: 2px; }
.tag.code { color: var(--p1); } .tag.judge { color: var(--p3); }
ol, ul { margin: 6px 0 0; padding-left: 20px; }
li { margin: 3px 0; }
.ratings { display: flex; flex-direction: column; gap: 10px; }
.rating { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 20px; align-items: center; }
@media (max-width: 720px) { .rating { grid-template-columns: 1fr; gap: 10px; } }
.scale { display: grid; grid-template-columns: 3fr 3fr 3fr 2fr; gap: 3px; }
.scale .bar { height: 6px; border-radius: 3px; }
.scale .band { font-size: 13px; line-height: 1.35; padding-top: 6px; }
.scale .band b { display: block; font-size: 11px; color: var(--ink2); font-weight: 600; font-variant-numeric: tabular-nums; }
.computed { font-size: 13px; color: var(--ink2); background: var(--soft); border-radius: 6px; padding: 10px 12px; }
.flow { overflow-x: auto; }
.flow svg { display: block; min-width: 760px; width: 100%; height: auto; }
.flow text { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--ink); }
.flow .lbl { fill: var(--ink2); font-size: 11px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink2); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
.full { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--soft); border-radius: 0 6px 6px 0; margin-top: 8px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.pass { color: var(--good); } .fail { color: var(--bad); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font: 11px -apple-system, sans-serif; fill: var(--ink2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin: 8px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.empty { padding: 20px; text-align: center; color: var(--ink2); background: var(--soft); border-radius: 8px; }
.scroll { overflow-x: auto; }
code { font: 12px ui-monospace, Menlo, monospace; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
.shot { display: grid; grid-template-columns: 3fr 1fr; gap: 10px; align-items: start; margin-top: 10px; }
.shot figure { margin: 0; min-width: 0; }
.shot img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: #000; }
.shot figcaption { font-size: 12px; color: var(--ink2); margin-top: 4px; }
.was img { opacity: 0.9; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; margin-top: 10px; }
.score-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 2px 0; }
.score-row b { font-variant-numeric: tabular-nums; }
.down { color: var(--bad); } .up { color: var(--good); } .gap { color: var(--accent); font-weight: 700; }
@media (max-width: 720px) { .shot { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Holos Playtests</h1>
  <p class="sub" id="sub"></p>
  <nav role="tablist" id="tabs">
    <a href="#how" id="tab-how" role="tab">How a run works</a>
    <a href="#results" id="tab-results" role="tab">Results</a>
    <a href="#screens" id="tab-screens" role="tab">Screens</a>
    <a href="#players" id="tab-players" role="tab">Players</a>
    <a href="#quiz" id="tab-quiz" role="tab">Quiz</a>
    <a href="#scenarios" id="tab-scenarios" role="tab">Scenarios</a>
    <a href="#checks" id="tab-checks" role="tab">Checks</a>
    <a href="#open" id="tab-open" role="tab">Open</a>
  </nav>

  <section class="pane" id="how" role="tabpanel" aria-labelledby="tab-how">
  <h2>How a run works</h2>
  <div class="card flow" id="flow"></div>
  <div class="grid" id="routines" style="margin-top:12px"></div>
  </section>

  <section class="pane" id="results" role="tabpanel" aria-labelledby="tab-results">
  <h2>Results</h2>
  <div class="card">
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="card scroll" style="margin-top:12px" id="runs"></div>
  </section>

  <section class="pane" id="screens" role="tabpanel" aria-labelledby="tab-screens">
  <h2>Screens</h2>
  <p class="muted small" id="screensRule"></p>
  <div class="tabs" id="capTabs"></div>
  <div id="sheet"></div>
  </section>

  <section class="pane" id="players" role="tabpanel" aria-labelledby="tab-players">
  <h2>Players and ratings</h2>
  <div class="tabs" id="playerTabs"></div>
  <div id="player"></div>
  <div class="card small muted" style="margin-top:12px"><b>Rules for every rating</b><ul id="rules"></ul></div>
  </section>

  <section class="pane" id="quiz" role="tabpanel" aria-labelledby="tab-quiz">
  <h2>Blind quiz</h2>
  <div id="quizBody"></div>
  </section>

  <section class="pane" id="scenarios" role="tabpanel" aria-labelledby="tab-scenarios">
  <h2>Scenarios</h2>
  <p class="muted small" id="scenarioRule"></p>
  <div class="tabs" id="scenarioTabs"></div>
  <div id="scenario"></div>
  </section>

  <section class="pane" id="checks" role="tabpanel" aria-labelledby="tab-checks">
  <h2>Code checks</h2>
  <div class="card scroll" id="checkTable"></div>
  <div class="card scroll" style="margin-top:12px"><b class="small">On every captured screen</b><div id="auditTable"></div></div>
  <div class="card small muted" style="margin-top:12px"><b>Known gaps, not to report</b><ul id="gaps"></ul></div>
  </section>

  <section class="pane" id="open" role="tabpanel" aria-labelledby="tab-open">
  <h2>Open questions</h2>
  <div class="card"><ul id="openList"></ul></div>
  </section>
</main>
<script src="runs.js"></script>
<script src="captures.js"></script>
<script>
const R = JSON.parse(document.getElementById("regime").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const COLORS = { "first-timer": "var(--p1)", astronomer: "var(--p2)", "long-hauler": "var(--p3)", blind: "var(--p4)" };

$("sub").textContent = `How we playtest Holos, and what it has found. Regime updated ${R.updated}. Quiz version ${R.quiz.version}.`;

// The flow of one run, from play to the trend.
(() => {
  const boxes = [
    ["Play", "a scenario, or blind"], ["Log", "log.jsonl, blind.jsonl"], ["Score", "checks, judge, players"], ["Scorecard", "SCORECARD.md"], ["Trend", "runs.js, this page"],
  ];
  const w = 130, gap = 34, h = 58, y = 18;
  let svg = `<svg viewBox="0 0 ${boxes.length * (w + gap) - gap + 20} 100" role="img" aria-label="A run goes from play, to its log, to scoring, to a scorecard, to the trend">`;
  svg += `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker></defs>`;
  boxes.forEach(([t, s], i) => {
    const x = 10 + i * (w + gap);
    svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="var(--soft)" stroke="${i === 2 ? "var(--accent)" : "var(--line)"}"/>`;
    svg += `<text x="${x + w / 2}" y="${y + 25}" text-anchor="middle">${t}</text><text class="lbl" x="${x + w / 2}" y="${y + 43}" text-anchor="middle">${s}</text>`;
    if (i < boxes.length - 1) svg += `<line x1="${x + w + 4}" y1="${y + h / 2}" x2="${x + w + gap - 4}" y2="${y + h / 2}" stroke="var(--ink2)" marker-end="url(#ar)"/>`;
  });
  $("flow").innerHTML = svg + "</svg>";
  $("routines").innerHTML = R.routines
    .map((r) => `<div class="card"><h3>${esc(r.name)}</h3><p class="small">${esc(r.what)}</p><p class="small muted">Follows <code>${esc(r.file)}</code>, pushes <code>${esc(r.branch)}</code>. Players: ${r.players.map(esc).join(", ")}.</p></div>`)
    .join("");
})();

// Players.
(() => {
  let current = R.players[0].id;
  const draw = () => {
    $("playerTabs").innerHTML = R.players.map((p) => `<button aria-pressed="${p.id === current}" data-id="${p.id}">${esc(p.id)}</button>`).join("");
    const p = R.players.find((x) => x.id === current);
    // One row a rating: what it asks, then its anchors along a 0 to 10 scale, from worst to best.
    const shades = ["var(--bad)", "color-mix(in srgb, var(--bad) 45%, var(--accent))", "color-mix(in srgb, var(--good) 55%, var(--accent))", "var(--good)"];
    $("player").innerHTML = `<p class="muted">${esc(p.who)}</p><div class="ratings">${p.ratings
      .map(
        (r) => `<div class="card rating"><div><h3>${esc(r.id)}${r.code ? '<span class="tag code">code</span>' : ""}${r.judge ? '<span class="tag judge">judge</span>' : ""}</h3><p class="small muted">${esc(r.q)}</p></div>${
          r.anchors
            ? `<div class="scale">${r.anchors.map((a, i) => `<div><div class="bar" style="background:${shades[i]}"></div><div class="band"><b>${R.anchorBands[i]}</b>${esc(a)}</div></div>`).join("")}</div>`
            : `<div class="computed">${r.code ? "Computed by code from the run’s log." : "Graded by the judge, who didn’t play."}</div>`
        }</div>`,
      )
      .join("")}</div>`;
  };
  $("playerTabs").addEventListener("click", (e) => { if (e.target.dataset.id) { current = e.target.dataset.id; draw(); } });
  draw();
  $("rules").innerHTML = R.ratingRules.map((r) => `<li>${esc(r)}</li>`).join("");
})();

// Quiz.
(() => {
  const q = R.quiz;
  $("quizBody").innerHTML = `
    <div class="card"><h3>Once, when play stops</h3><p class="small muted">${esc(q.onceRule)}</p>
      <div class="grid" style="margin-top:10px">${q.once
        .map((x) => `<div class="card"><h3>${esc(x.tab ?? "Premise")}</h3><p>“${esc(x.q)}”</p><p class="small muted">Tests: ${esc(x.tests)}</p><div class="full"><b class="small">Full marks</b><br>${esc(x.full)}</div></div>`)
        .join("")}</div></div>
    <div class="card" style="margin-top:12px"><h3>Check-in, every ${q.checkin.every} actions</h3><p class="small muted">${esc(q.checkin.rule)}</p>
      <ul>${q.checkin.questions.map((x) => `<li>“${esc(x.q)}”</li>`).join("")}</ul>
      <div class="full"><b class="small">Full marks</b><br>${esc(q.checkin.full)}</div>
      ${checkinStrip(q.checkin.every)}</div>
    <div class="card small muted" style="margin-top:12px"><b>Ungraded, at the end</b><ul>${q.ungraded.map((x) => `<li>“${esc(x.q)}”</li>`).join("")}</ul></div>`;
})();

// Where the check-ins fall across a 150-action run.
function checkinStrip(every) {
  const W = 600, n = 150, x = (i) => 10 + (i / n) * (W - 20);
  let s = `<svg viewBox="0 0 ${W} 46" style="width:100%;height:auto;margin-top:12px" role="img" aria-label="Check-ins every ${every} actions across 150 actions, then the once questions"><line x1="10" y1="20" x2="${W - 10}" y2="20" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>`;
  for (let i = every; i < n; i += every) s += `<circle cx="${x(i)}" cy="20" r="6" fill="var(--p3)"/><text x="${x(i)}" y="42" text-anchor="middle" font-size="11" fill="var(--ink2)">${i}</text>`;
  s += `<rect x="${x(n) - 8}" y="12" width="16" height="16" rx="3" fill="var(--accent)"/><text x="${x(n)}" y="42" text-anchor="end" font-size="11" fill="var(--ink2)">150, once</text>`;
  return s + "</svg>";
}

// Scenarios.
(() => {
  $("scenarioRule").textContent = R.scenarioRule;
  let current = R.scenarios[0].id;
  const draw = () => {
    $("scenarioTabs").innerHTML = R.scenarios.map((s, i) => `<button aria-pressed="${s.id === current}" data-id="${s.id}">${i + 1}. ${esc(s.title)}</button>`).join("");
    const s = R.scenarios.find((x) => x.id === current);
    $("scenario").innerHTML = `<div class="grid"><div class="card"><h3>${esc(s.what)}</h3>${s.from ? `<p class="small muted">Starts from the saved state <code>${esc(s.from)}</code>, past the opening.</p>` : ""}<b class="small">Steps</b><ol class="small">${s.steps.map((x) => `<li>${esc(x)}</li>`).join("")}</ol><p class="small muted" style="margin-top:8px">Stop: ${esc(s.stop)}</p></div>
      <div class="card"><b class="small">Expect</b><ol class="small">${s.expect.map((x, i) => `<li><code>${s.id}-${i + 1}</code> ${esc(x)}</li>`).join("")}</ol></div></div>`;
  };
  $("scenarioTabs").addEventListener("click", (e) => { if (e.target.dataset.id) { current = e.target.dataset.id; draw(); } });
  draw();
})();

// Checks, with how often each failed across runs once runs.js is in.
function drawChecks(runs) {
  const fails = Object.fromEntries(R.checks.map((c) => [c.name, { ran: 0, failed: 0 }]));
  for (const r of runs ?? []) for (const c of r.checks ?? []) if (fails[c.name] && c.fails) { fails[c.name].ran++; if (c.fails.length) fails[c.name].failed++; }
  $("checkTable").innerHTML = `<table><tr><th>Check</th><th>Rule</th><th class="n">Runs failed</th></tr>${R.checks
    .map((c) => { const f = fails[c.name]; return `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.why)}</td><td class="n ${f.failed ? "fail" : f.ran ? "pass" : "muted"}">${f.ran ? `${f.failed} of ${f.ran}` : "–"}</td></tr>`; })
    .join("")}</table>`;
}
$("auditTable").innerHTML = `<table>${R.audit.rules.map((c) => `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.why)}</td></tr>`).join("")}</table>`;
$("gaps").innerHTML = R.knownGaps.map((g) => `<li>${esc(g)}</li>`).join("");
$("openList").innerHTML = R.open.map((g) => `<li>${esc(g)}</li>`).join("");

// Results, from runs.js, which npm run playtest:score writes. A script, not a fetch, so the page opens from a file.
function drawResults(runs) {
  const povs = ["first-timer", "astronomer", "long-hauler", "blind"];
  $("legend").innerHTML = povs.map((p) => `<span><i style="background:${COLORS[p]}"></i>${p}</span>`).join("") + `<span class="muted">Each dot is a run, oldest left.</span>`;
  const W = 900, H = 240, L = 30, B = 26, T = 10;
  const x = (i) => L + (runs.length < 2 ? 0.5 : i / (runs.length - 1)) * (W - L - 10);
  const y = (v) => T + (1 - v / 10) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Each player's average score per run, 0 to 10">`;
  for (const v of [0, 5, 10]) s += `<line x1="${L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (const p of povs) {
    const pts = runs.map((r, i) => [i, r.avg?.[p]]).filter(([, v]) => typeof v === "number");
    if (pts.length > 1) s += `<polyline fill="none" stroke="${COLORS[p]}" stroke-width="2" points="${pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    for (const [i, v] of pts) s += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${COLORS[p]}"><title>${esc(runs[i].name)} ${p} ${v}</title></circle>`;
  }
  runs.forEach((r, i) => { if (i === 0 || i === runs.length - 1 || r.name.slice(0, 10) !== runs[i - 1].name.slice(0, 10)) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === runs.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${r.name.slice(5, 10)}</text>`; });
  $("chart").innerHTML = s + "</svg>";
  $("runs").innerHTML = `<table><tr><th>Run</th><th>Build</th><th>Scenario</th><th>Seed</th>${povs.map((p) => `<th class="n">${p}</th>`).join("")}<th class="n">Overall</th><th class="n">Checks</th><th class="n">Minutes</th><th class="n">Tokens</th></tr>${runs
    .slice()
    .reverse()
    .map((r) => {
      const t = r.tally ?? { ran: 0, failed: 0 };
      const f = (r.checks ?? []).filter((c) => c.fails?.length).map((c) => c.name).join(", ");
      return `<tr><td>${esc(r.name)}</td><td><code>${esc(r.build ?? "?")}</code></td><td>${esc(r.scenario ?? "–")}</td><td>${esc(r.seed ?? "–")}</td>${povs
        .map((p) => `<td class="n">${r.avg?.[p] ?? "–"}</td>`)
        .join("")}<td class="n"><b>${r.avg?.overall ?? "–"}</b></td><td class="n ${t.failed ? "fail" : "pass"}" title="${esc(f)}">${t.ran ? `${t.ran - t.failed}/${t.ran}` : "–"}</td><td class="n">${r.minutes ?? "–"}</td><td class="n">${r.tokens == null ? "–" : r.tokens >= 1e6 ? `${(r.tokens / 1e6).toFixed(1)}M` : `${Math.round(r.tokens / 1000)}k`}</td></tr>`;
    })
    .join("")}</table>`;
}

// Tabs: one section at a time, kept in the address so a reload or a link lands on the same one.
const panes = [...document.querySelectorAll(".pane")].map((p) => p.id);
function show() {
  const id = panes.includes(location.hash.slice(1)) ? location.hash.slice(1) : panes[0];
  for (const p of panes) {
    document.getElementById(p).hidden = p !== id;
    document.getElementById(`tab-${p}`).setAttribute("aria-selected", String(p === id));
  }
}
// The tab's id is also its section's, so the browser would scroll to it. Keep the page at the top instead.
$("tabs").addEventListener("click", (e) => {
  const a = e.target.closest("a[role=tab]");
  if (!a) return;
  e.preventDefault();
  history.replaceState(null, "", a.getAttribute("href"));
  show();
});
addEventListener("hashchange", show);
show();
requestAnimationFrame(() => scrollTo(0, 0));

const runs = window.RUNS;
if (runs?.length) { drawResults(runs); drawChecks(runs); }
else {
  $("chart").innerHTML = `<div class="empty">No results yet. Run <code>npm run playtest:score</code> to score every run, then reload.</div>`;
  drawChecks([]);
}
// Screens: each named state's shots from the newest capture run, beside the run before, with the critic's scores.
function drawScreens(caps) {
  $("screensRule").textContent = R.screensRule;
  if (!caps?.length) { $("sheet").innerHTML = `<div class="empty">No captures yet. Run <code>npm run playtest:capture</code>, then <code>npm run playtest:critic</code>, and reload.</div>`; return; }
  let at = caps.length - 1, compare = false;
  const ids = R.screens.ratings.map((r) => r.id);
  const img = (run, file, label) => `<figure><a href="captures/${esc(run)}/${esc(file)}" target="_blank"><img loading="lazy" src="captures/${esc(run)}/${esc(file)}" alt="${esc(label)}"></a><figcaption>${esc(label)}</figcaption></figure>`;
  const draw = () => {
    const cap = caps[at], prev = caps[at - 1];
    $("capTabs").innerHTML = caps.map((c, i) => `<button aria-pressed="${i === at}" data-i="${i}">${esc(c.run)}</button>`).join("") +
      (prev ? `<button data-compare aria-pressed="${compare}">Show ${esc(prev.run)} beside</button>` : "");
    const bad = cap.shots.filter((x) => x.status !== "ok");
    $("sheet").innerHTML = `<p class="small muted">Build <code>${esc(cap.build ?? "?")}</code>${cap.dirty ? " with uncommitted game changes" : ""}. ${cap.shots.length - bad.length} of ${cap.shots.length} shots.${cap.critic ? ` Readers: ${esc(cap.critic.model)}${cap.critic2 ? ` · ${esc(cap.critic2.model)}, scores in that order. Orange marks where they part by 2 or more` : ""}.` : " Not scored yet."}</p>` +
      designCard(cap, prev) +
      R.states.map((st) => {
        const shots = cap.shots.filter((x) => x.state === st.id);
        if (!shots.length) return "";
        const vps = shots.map((x) => x.viewport);
        const c = cap.critic?.states?.[st.id], pc = prev?.critic?.states?.[st.id];
        const c2 = cap.critic2?.states?.[st.id];
        // Desktop and phone side by side, each at its own shape, and the run before beneath when compared.
        const fig = (run, x) => x.status === "ok" ? img(run.run, x.file, `${x.viewport}, ${run.run}${x.errors?.length ? `, ${x.errors.length} console error(s)` : ""}`) : `<div class="empty small">${esc(x.viewport)}: ${esc(x.status)}${x.errors?.[0] ? `<br>${esc(x.errors[0])}` : ""}</div>`;
        const row = (run, list) => `<div class="shot">${list.map((x) => fig(run, x)).join("")}</div>`;
        const was = compare && prev ? prev.shots.filter((y) => y.state === st.id) : [];
        const pics = row(cap, shots) + (was.length ? row(prev, was) : "");
        const scores = c && !c.error ? `<div class="scores">${vps.map((vp) => c[vp] ? `<div><b class="small">${esc(vp)}</b>${ids.map((k) => {
          const v = c[vp][k]?.score, w = pc?.[vp]?.[k]?.score;
          const d = typeof v === "number" && typeof w === "number" ? v - w : 0;
          return `<div class="score-row" title="${esc(c[vp][k]?.why)}"><span>${esc(k)}</span><b>${v ?? "–"}${d ? ` <span class="${d < 0 ? "down" : "up"}">${d > 0 ? "+" : ""}${d}</span>` : ""}${two(v, c2?.[vp]?.[k]?.score)}</b></div>`;
        }).join("")}<p class="small" style="margin-top:6px"><span class="muted">Worst:</span> ${esc(c[vp].worst)}<br><span class="muted">Fix:</span> ${esc(c[vp].fix)}</p>${c2?.[vp]?.worst ? `<p class="small muted"><b>Second reader:</b> ${esc(c2[vp].worst)}</p>` : ""}</div>` : "").join("")}</div>` : c?.error ? `<p class="small fail">Critic: ${esc(c.error)}</p>` : "";
        // Code's flags for each width, then the editor's cuts.
        const flags = shots.filter((x) => x.status === "ok").map((x) => {
          const f = [...(x.faults ?? []).map((y) => ({ ...y, kind: "layout" })), ...(x.language ?? []).map((y) => ({ ...y, kind: "words" }))];
          if (!f.length) return `<p class="small pass">${esc(x.viewport)}: code found nothing.</p>`;
          const by = {};
          for (const y of f) (by[y.rule] ??= []).push(y);
          return `<details class="small" style="margin-top:6px"><summary>${esc(x.viewport)}: code flagged ${Object.entries(by).map(([k, v]) => `${v.length} ${esc(k)}`).join(", ")}</summary><table>${f
            .map((y) => `<tr><td>${esc(y.rule)}</td><td>${esc(y.text)}</td><td class="muted">${esc(y.note ?? "")}</td></tr>`)
            .join("")}</table></details>`;
        }).join("");
        const ed = cap.critic?.editor?.[st.id], ped = prev?.critic?.editor?.[st.id];
        const ed2 = cap.critic2?.editor?.[st.id];
        const edit = ed && !ed.error ? `<div style="margin-top:10px"><b class="small">Words</b> <span class="small muted">${R.editor.ratings.map((r) => {
          const v = ed[r.id]?.score, w = ped?.[r.id]?.score, d = typeof v === "number" && typeof w === "number" ? v - w : 0;
          return `<span title="${esc(ed[r.id]?.why)}">${esc(r.id)} <b>${v ?? "–"}</b>${d ? ` <span class="${d < 0 ? "down" : "up"}">${d > 0 ? "+" : ""}${d}</span>` : ""}${two(v, ed2?.[r.id]?.score)}</span>`;
        }).join(" · ")} · ${ed.saved} of ${ed.words} words could go</span>${ed.rewrites?.length ? `<table style="margin-top:6px"><tr><th>Now</th><th>Cut to</th><th class="n">Saves</th></tr>${ed.rewrites.map((x) => `<tr><td class="muted">${esc(x.was)}</td><td>${esc(x.now)}</td><td class="n">${x.saved}</td></tr>`).join("")}</table>` : ""}</div>` : ed?.error ? `<p class="small fail">Editor: ${esc(ed.error)}</p>` : "";
        return `<div class="card" style="margin-top:12px"><h3>${esc(st.title)} <span class="tag">${esc(st.path)}</span></h3><p class="small muted">${esc(st.description)}</p>${pics}${scores}${flags}${edit}</div>`;
      }).join("");
  };
  $("capTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.compare !== undefined) compare = !compare; else { at = Number(b.dataset.i); }
    draw();
  });
  draw();
}
// The second reader's score beside Claude's, marked when they part by 2 or more.
const two = (v, v2) => (typeof v2 !== "number" ? "" : ` <span class="${typeof v === "number" && Math.abs(v - v2) >= 2 ? "gap" : "muted"}" title="Second reader">· ${v2}</span>`);
// The designer's pass over every screen at once.
function designCard(cap, prev) {
  const d = cap.critic?.design, pd = prev?.critic?.design;
  const d2 = cap.critic2?.design;
  if (!d) return "";
  if (d.error) return `<div class="card small fail">Design pass: ${esc(d.error)}</div>`;
  return `<div class="card" style="margin-top:12px"><h3>All screens together</h3><p class="small muted">${esc(R.design.who)}</p><div class="scores">${R.design.ratings.map((r) => {
    const v = d[r.id]?.score, w = pd?.[r.id]?.score, n = typeof v === "number" && typeof w === "number" ? v - w : 0;
    return `<div class="score-row" title="${esc(d[r.id]?.why)}"><span>${esc(r.id)}</span><b>${v ?? "–"}${n ? ` <span class="${n < 0 ? "down" : "up"}">${n > 0 ? "+" : ""}${n}</span>` : ""}${two(v, d2?.[r.id]?.score)}</b></div>`;
  }).join("")}</div>${d.issues?.length ? `<table style="margin-top:10px"><tr><th>Screen</th><th>Issue</th><th>Fix</th></tr>${[...d.issues, ...(d2?.issues ?? []).map((x) => ({ ...x, state: `${x.state} (second reader)` }))].map((x) => `<tr><td>${esc(x.state)}<br><span class="muted">${esc(x.viewport)}, ${esc(x.where)}</span></td><td>${esc(x.issue)}</td><td>${esc(x.fix)}</td></tr>`).join("")}</table>` : ""}</div>`;
}
drawScreens(window.CAPTURES);
</script>
</body>
