name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            game/pnpm-lock.yaml
      # The atlas, checked against JPL Horizons.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The game, its simulation checked against the Python.
      - run: pnpm install --frozen-lockfile
        working-directory: game
      - run: pnpm test
        working-directory: game
      - run: pnpm lint
        working-directory: game
