<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=SUSE:wght@100..800&display=swap" rel="stylesheet">
<style>
/* Offline, the game's own copies of the fonts. */
@font-face { font-family: "SUSE Variable"; font-weight: 100 800; src: url("../game/node_modules/@fontsource-variable/suse/files/suse-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Plex Mono Local"; font-weight: 400; src: url("../game/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }

/* Colors from game/app/globals.css. The game is always dark. */
:root {
  --paper: #121314; --ink: #e6e3db; --muted: #9c988f; --faint: #34363a; --panel: #17181a; --rowline: #26282b;
  --track: #2a2b2e; --fill2: #bdb9af; --page-ink2: #a9a59c; --you: #5bb8d6; --other: #e0a24a; --see: #70d1a9;
  --think: #b39ef2; --frame: #2a2b2e;
  --sans: "SUSE", "SUSE Variable", sans-serif;
  --mono: "IBM Plex Mono", "Plex Mono Local", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: #070808; color: var(--ink); font-family: var(--sans); text-wrap: pretty; }
p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

header { max-width: 1400px; margin: 0 auto; padding: 40px 16px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; font-weight: 600; }
header p { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 72ch; line-height: 1.45; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--muted); }
.ctl button { background: none; color: var(--muted); border: 1px solid var(--frame); border-radius: 999px; padding: 5px 10px; font: inherit; cursor: pointer; }
.ctl button:hover { color: var(--ink); }
.ctl button[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }

main { max-width: 1400px; margin: 0 auto; padding: 16px 16px 64px; display: grid; gap: 32px 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.meta { display: flex; gap: 10px; align-items: baseline; }
.num { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.name { font-size: 15px; font-weight: 600; }
.note { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: -4px; min-height: 3.6em; }

/* The game's screen: the top bar and the Build tab, before Begin. */
.frame { position: relative; width: 100%; max-width: 430px; height: 820px; background: var(--paper); border: 1px solid var(--rowline); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--faint); flex: none; }
.gal { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #fff 0, #bbb 25%, transparent 70%); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, var(--you) 55%, transparent); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.pill b { color: var(--you); font-weight: 500; }
.pill i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--you); border-right-color: var(--you); }
.pill.all i { border-color: var(--you); }
.pn { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 28px; overscroll-behavior: contain; background: var(--panel); }
.th { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.th span:last-child { font: 10.5px var(--mono); letter-spacing: .06em; color: var(--you); }
.lh { display: flex; justify-content: space-between; margin-top: 16px; padding-bottom: 6px; border-bottom: 1px solid var(--rowline); font: 10px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.row { display: grid; grid-template-columns: 18px 1fr auto; gap: 0 12px; padding: 11px 0; border-bottom: 1px solid var(--rowline); }
.row .mk { color: var(--c); margin-top: 2px; }
.row.out .mk { opacity: .6; }
.row.locked .mk, .row.locked b { opacity: .5; }
.tx { min-width: 0; }
.tx b { font-size: 15px; font-weight: 600; }
.tx > p { font-size: 13px; line-height: 1.35; color: var(--page-ink2); margin-top: 1px; }
.fx { font-size: 12px; line-height: 1.35; margin-top: 4px; color: var(--muted); }
.fx .late { color: var(--other); }
.fx .soon { color: var(--see); }
.rt { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.t { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.pk { position: relative; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--faint); background: none; cursor: pointer; display: grid; place-items: center; font: 12px var(--mono); color: var(--muted); padding: 0; }
.pk::before { content: ""; position: absolute; inset: -10px; }
.pk:hover { color: var(--ink); border-color: var(--muted); }
.pk.on { background: var(--you); border-color: var(--you); color: var(--paper); }
.lk { color: var(--muted); font-size: 11px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 44px; border-radius: 999px; border: 1px solid var(--ink); background: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .3s, color .3s, opacity .3s; }
.btn.go { background: var(--ink); color: var(--paper); }
.btn.quiet { border-color: var(--faint); color: var(--muted); }
.more { display: block; margin-top: 14px; font: 10.5px var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar s { position: absolute; inset: 0 auto 0 0; background: var(--fill2); border-radius: 4px; transition: width .5s cubic-bezier(.2,.8,.2,1), background .4s; }
.bar.full s { background: var(--see); }

/* 01 Verdict */
.kick { font: 10px var(--mono); letter-spacing: .12em; color: var(--muted); }
.v1 h2 { margin: 6px 0 0; font-size: 19px; font-weight: 600; line-height: 1.25; }
.v1 .bl { display: flex; justify-content: space-between; margin-top: 6px; font: 11px var(--mono); color: var(--muted); }
.verdict { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--faint); font-size: 14px; line-height: 1.35; transition: border-color .3s, background .3s; }
.verdict.ok { border-color: color-mix(in srgb, var(--see) 60%, transparent); background: color-mix(in srgb, var(--see) 8%, transparent); }
.verdict svg { flex: none; margin-top: 1px; }
.rule { margin-top: 10px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.v1 .btn { margin-top: 12px; }

/* 02 Checklist */
.steps { position: relative; margin-top: 8px; }
.steps::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 14px; width: 1px; background: var(--faint); }
.step { position: relative; display: grid; grid-template-columns: 17px 1fr; gap: 0 12px; padding: 7px 0; font-size: 14px; color: var(--muted); }
.step .dot { position: relative; z-index: 1; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--faint); background: var(--panel); display: grid; place-items: center; font-size: 10px; }
.step.done { color: var(--page-ink2); }
.step.done .dot { background: var(--you); border-color: var(--you); color: var(--paper); }
.step.now { color: var(--ink); }
.step.now .dot { border-color: var(--you); box-shadow: 0 0 0 4px color-mix(in srgb, var(--you) 18%, transparent); }
.step.now .dot::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--you); }
.step.now.ok .dot { background: var(--see); border-color: var(--see); box-shadow: none; }
.step.now.ok .dot::after { display: none; }
.sub { margin: 8px 0 4px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.sub li { display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
.sub li.ok { color: var(--ink); }
.sub li i { font-style: normal; width: 12px; color: var(--see); }
.sub li:not(.ok) i { color: var(--muted); }
.sub em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--other); }
.step .btn { margin-top: 8px; height: 38px; font-size: 14px; }
.step.begin .dot { border-style: dashed; }

/* 03 Fill */
.vessel { display: grid; place-items: center; margin-top: 6px; }
.vessel svg { overflow: visible; }
.wave { animation: wave 6s linear infinite; }
@keyframes wave { to { transform: translateX(-160px); } }
.glow { opacity: 0; transition: opacity .6s; }
.full .glow { opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.vc { text-align: center; margin-top: 4px; }
.vc b { display: block; font-size: 17px; font-weight: 600; }
.vc span { font-size: 12.5px; color: var(--muted); }
.drop { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--mono); color: var(--muted); }
.drop i { width: 8px; height: 10px; background: var(--c); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }

/* 04 Mind */
.mind { position: relative; margin-top: 8px; padding: 12px 12px 12px 14px; border-left: 1px solid color-mix(in srgb, var(--you) 60%, transparent); }
.mind .who { font: 10px var(--mono); letter-spacing: .12em; color: var(--you); }
.mind p { margin-top: 4px; font-size: 15px; line-height: 1.4; }
.mind p.last { font-size: 13px; color: var(--page-ink2); }
.mind p.last .late { color: var(--other); }
.mind p.last .soon { color: var(--see); }
.v4 .bar { margin-top: 12px; height: 4px; }
.v4 .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.v4 .btn { height: 40px; font-size: 14px; }

/* 05 Timeline */
.status { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--faint); font-size: 13px; transition: border-color .3s, color .3s; }
.status.ok { border-color: color-mix(in srgb, var(--see) 60%, transparent); color: var(--see); }
.ruler { position: relative; height: 18px; margin: 12px 0 2px 26px; border-bottom: 1px solid var(--faint); font: 9.5px var(--mono); color: var(--muted); }
.ruler span { position: absolute; bottom: 3px; transform: translateX(-50%); white-space: nowrap; }
.runs { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.run { display: grid; grid-template-columns: 16px 1fr; gap: 0 10px; align-items: center; height: 22px; }
.run .mk { color: var(--c); display: flex; }
.run .tr { position: relative; height: 14px; }
.run .ln { position: absolute; left: 0; top: 6px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 15%, transparent), var(--c)); transition: width .55s cubic-bezier(.2,.8,.2,1); }
.run .dm { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border: 1.5px solid var(--c); background: var(--panel); transform: rotate(45deg); transition: left .55s cubic-bezier(.2,.8,.2,1); }
.run .lab { position: absolute; top: -1px; font: 10px var(--mono); color: var(--muted); white-space: nowrap; transition: left .55s cubic-bezier(.2,.8,.2,1); }
.gnone { font-size: 12.5px; color: var(--muted); padding: 6px 0; }

/* 06 Footer */
.v6 .lead { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.foot { flex: none; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 16px 14px; border-top: 1px solid var(--faint); background: var(--paper); }
.foot .st { font-size: 12.5px; line-height: 1.3; }
.foot .st b { display: block; font-size: 14px; font-weight: 600; }
.foot .bar { margin-top: 6px; height: 4px; }
.foot .btn { width: auto; padding: 0 16px; height: 40px; font-size: 14px; white-space: nowrap; }

.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Build Step</h1>
    <p>Six ways to make the step before Begin plain: what to do, when it is done, and that no plan is wrong. Every number comes live from the game’s own pace at a typical Earth’s compute. Tap + to queue and − to take out. The queue is shared across all six.</p>
  </div>
  <div class="ctl">
    <button data-q="none">Empty</button>
    <button data-q="watches">Two watches</button>
    <button data-q="scope">Telescope</button>
    <button data-q="ours">Our queue</button>
    <button data-q="all">All 12</button>
    <button id="mo" aria-pressed="true">Motion</button>
  </div>
</header>
<main id="cards"></main>

function mark(k, size) {
  const [g, inner] = MARKS[k];
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${g} ${g}" fill="none" stroke="currentColor" stroke-width="${g === 24 ? 2 : 1.3}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

const CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#70d1a9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="7" stroke-width="1.2"/><path d="M4.8 8.2l2.2 2.2 4.2-4.6"/></svg>';
const OPEN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9c988f" stroke-width="1.2"><circle cx="8" cy="8" r="7" stroke-dasharray="2 2"/></svg>';

/** What a queue means, for every frame: when each build is done, how much of our compute has work, and what each
 *  build we could start would do to it. */
function model(q) {
  const plan = { builds: q, observe: [] };
  const used = q.length ? H.inUse(plan, SCALE) : 0;
  const shares = H.sharesAt(plan, SCALE, 0);
  const room = 1 - shares.studies - shares.fields;
  return {
    q, plan, used, full: used > 0.995, over: shares.short > 0.005, done: H.schedule(plan, SCALE),
    parts: shares.parts.map((p) => ({ name: p.name, need: p.need / room, push: p.spare / room })),
    effect: Object.fromEntries(NAMES.filter((n) => !q.includes(n)).map((n) => [n, H.lacks(plan, n).length ? { lock: H.lacks(plan, n) } : H.moves(plan, SCALE, n)])),
  };
}

function moveLine(e) {
  const out = [];
  if (e.late) out.push(`<span class="late">slows ${the(e.late.name)} ${span(e.late.by)}</span>`);
  if (e.soon) out.push(`<span class="soon">speeds ${the(e.soon.name)} ${span(e.soon.by)}</span>`);
  return out.join(", ");
}

/** The top bar's count, as the game has it: the four things we would do first, this one lit once done. */
function topBar(m) {
  const n = 1 + (m.full ? 1 : 0);
  return `<div class="top"><span class="gal"></span><span class="pill"><i></i>${n} of 4 ready · <b>${m.full ? "See where to go" : "Queue builds"}</b></span></div>`;
}

/** A row: its mark, name and line, a line under it the frame chooses, how long until done, and the pick. */
function row(n, m, under) {
  const at = m.q.includes(n);
  const e = m.effect[n];
  const lock = !at && e?.lock;
  return `<li class="row${at ? "" : " out"}${lock ? " locked" : ""}" style="--c:${color(n)}">
    <span class="mk">${mark(n, 18)}</span>
    <div class="tx"><b>${n}</b><p>${BY[n].what}</p>${under ? `<p class="fx">${under}</p>` : ""}</div>
    <div class="rt"><span class="t">${lock ? "" : span(at ? m.done[n] : e.at)}</span>
      ${lock ? `<span class="lk">${mark("lock", 14)}</span>` : `<button class="pk${at ? " on" : ""}" data-n="${n}" aria-label="${at ? "Take out" : "Queue"} ${n}">${at ? "−" : "+"}</button>`}
    </div></li>`;
}
function lists(m, under) {
  const rest = NAMES.filter((n) => !m.q.includes(n));
  return `${m.q.length ? `<div class="lh"><span>Queued · ${m.q.length}</span><span>Done in</span></div><ul>${m.q.map((n) => row(n, m, under(n, true))).join("")}</ul>` : ""}
    <div class="lh"><span>${m.q.length ? "We could also start" : "We could start"} · ${rest.length}</span><span>Done in</span></div>
    <ul>${rest.map((n) => row(n, m, under(n, false))).join("")}</ul>`;
}
const tradeoff = (m) => (n, at) => {
  const e = m.effect[n];
  if (at) return "";
  if (e.lock) return `Needs ${H.needs(e.lock)} queued first.`;
  const mv = moveLine(e);
  return mv ? `Queued, it ${mv}.` : "Slows nothing we’ve queued.";
};
const idleLine = (m) => (m.q.length ? `${pct(1 - m.used)} of our compute would sit idle.` : "Nothing queued. All our compute would sit idle.");

const VIEWS = [
  {
    name: "Verdict",
    note: "The step named, its one rule, and a verdict that says done or not, with the way on. Each build we could start says what queuing it would slow. Matter and energy wait behind More.",
    body(m) {
      return `<div class="v1"><div class="kick">STEP 2 OF 4</div><h2>Choose what we build first</h2>

        <p class="rule">Done when all our compute has work. No plan is wrong: more builds start together, and each finishes later.</p>
        <button class="btn ${m.full ? "go" : "quiet"}">Next: See where to go ›</button></div>
        ${lists(m, tradeoff(m))}<span class="more">More: matter and energy ›</span>`;
    },
  },
  {
    name: "Checklist",
    note: "The four things we would do first, as a thread down to Begin, with this one open: two checks, ticked as they come true, and the way on once both are.",
    body(m) {
      const sub = [
        [m.q.length > 0, "At least one build queued"],
        [m.full, "All our compute has work", m.full ? "" : `<em>${pct(1 - m.used)} idle</em>`],
      ];
      return `<ol class="steps">
        <li class="step done"><span class="dot">✓</span><span>Review our scans</span></li>
        <li class="step now${m.full ? " ok" : ""}"><span class="dot">${m.full ? "✓" : ""}</span><div><b style="font-weight:600">Queue our first builds</b>
          <ul class="sub">${sub.map(([ok, t, x]) => `<li class="${ok ? "ok" : ""}"><i>${ok ? "✓" : "○"}</i>${t} ${x ?? ""}</li>`).join("")}</ul>
          ${m.full ? `<button class="btn go">Next: See where to go ›</button>` : ""}</div></li>
        <li class="step"><span class="dot"></span><span>See where we could go</span></li>
        <li class="step"><span class="dot"></span><span>Ask the Mind</span></li>

      let y = 160, layers = "";
      for (const p of m.parts) {
        const h1 = p.need * 140, h2 = p.push * 140;
        y -= h1; layers += `<rect x="0" y="${y}" width="160" height="${h1 + 0.5}" fill="${color(p.name)}"/>`;
        y -= h2; layers += `<rect x="0" y="${y}" width="160" height="${h2 + 0.5}" fill="${color(p.name)}" opacity=".38"/>`;
      }
      const top = 160 - Math.min(1, m.used) * 140;
      const wave = `<path class="wave" d="M0 ${top} q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V170 H0Z" fill="#ffffff" opacity=".05"/>`;
      return `<div class="vessel${m.full ? " full" : ""}"><svg width="170" height="170" viewBox="0 0 160 160">
          <defs><clipPath id="vc"><circle cx="80" cy="80" r="70"/></clipPath></defs>
          <circle class="glow" cx="80" cy="80" r="76" fill="none" stroke="#70d1a9" stroke-width="2"/>
          <circle cx="80" cy="80" r="70" fill="#1c1d20"/>
          <g style="clip-path:url(#vc)"><g style="transform:translateY(0)">${layers}</g>${m.used > 0 ? wave : ""}</g>
          <circle cx="80" cy="80" r="70" fill="none" stroke="#34363a"/>
        </svg></div>
        <div class="vc"><b>${m.full ? "Full. Ready to begin." : m.q.length ? `${pct(m.used)} full` : "Empty"}</b>
          <span>${m.full ? "All our compute has work." : "Fill it with builds. No plan is wrong."}</span></div>
        <button class="btn ${m.full ? "go" : "quiet"}" style="margin-top:12px">Next: See where to go ›</button>
        ${lists(m, (n, at) => (at || m.effect[n].lock ? "" : `<span class="drop" style="--c:${color(n)}"><i></i>${n === "Thought Fields" ? "5% of our compute, while a campus builds" : `${pct(NEED[n])} of our compute, or more to finish sooner`}</span>`))}`;
    },
  },
  {
    name: "Mind",
    note: "The Mind says where the step stands, in a breath, and what the last change did. It advises and queues nothing. A thin bar under it fills as we queue.",
    body(m) {
      const say = !m.q.length
        ? "Nothing queued yet, so our compute would sit idle. We could start with anything below."
        : m.over
          ? "This step is done, and then some: we have queued more than our compute carries, so the last in line wait their turn. Taking some out would bring the rest sooner."
          : m.full
          ? "All our compute has work, so this step is done. We could begin, or add more: each build we add starts too, and finishes later."
          : `Our order leaves ${pct(1 - m.used)} of our compute idle. One more build would put it to work.`;
      return `<div class="v4"><div class="mind"><span class="who">THE MIND</span><p>${say}</p>${last ? `<p class="last">${last}</p>` : ""}</div>
        <div class="bar${m.full ? " full" : ""}"><s style="width:${m.used * 100}%"></s></div>
        <div class="row2"><button class="btn ${m.full ? "go" : "quiet"}">Next ›</button><button class="btn quiet">Ask the Mind</button></div></div>
        ${lists(m, tradeoff(m))}`;
    },
  },
  {
    name: "Timeline",
    note: "What we will have, and when: each queued build runs from Year 0 to its finish, and moves as we add or take out. A badge says ready once all our compute has work.",
    body(m) {
      const ends = m.q.map((n) => Math.min(40, m.done[n] ?? 40));
      const N = Math.max(10, Math.ceil(Math.max(0, ...ends) / 5) * 5);
      const X = (y) => `${Math.min(100, (y / N) * 100)}%`;
      let ruler = "";
      for (let y = 0; y <= N; y += N > 20 ? 10 : 5) ruler += `<span style="left:${X(y)};${y === 0 ? "transform:none" : y >= N ? "transform:translateX(-100%)" : ""}">${y ? span(y) : "Begin"}</span>`;
      const runs = m.q.map((n) => {
        const y = Math.min(40, m.done[n] ?? 40);
        return `<div class="run" style="--c:${color(n)}"><span class="mk">${mark(n, 13)}</span><div class="tr"><span class="ln" style="width:${X(y)}"></span><span class="dm" style="left:${X(y)}"></span><span class="lab" style="left:calc(${X(y)} + 8px)">${y / N > 0.7 ? "" : span(m.done[n])}</span></div></div>`;
      }).join("");
      return `<div class="kick">WHAT WE’LL HAVE, AND WHEN</div>
        <span class="status${m.full ? " ok" : ""}">${m.full ? CHECK : OPEN}${m.full ? "Ready to begin" : idleLine(m)}</span>
        <div class="ruler">${ruler}</div><div class="runs">${runs || `<p class="gnone">Queue a build to see when we’ll have it.</p>`}</div>
        ${lists(m, (n, at) => (at ? "" : m.effect[n].lock ? `Needs ${H.needs(m.effect[n].lock)} queued first.` : moveLine(m.effect[n]) ? `Queued, it ${moveLine(m.effect[n])}.` : ""))}`;
    },
  },
  {
    name: "Footer",
    note: "The list as it is, and a bar pinned to the bottom that always says where we stand and the one thing to do next: queue a build, or go on.",
    foot: true,
    body(m) {
      return `<div class="v6"><p class="lead">Choose what we build first. No plan is wrong: more builds start together, and each finishes later.</p></div>${lists(m, () => "")}`;
    },
    footer(m) {
      return `<div class="foot"><div class="st"><b>${m.full ? "All our compute has work" : m.q.length ? `${pct(1 - m.used)} of our compute idle` : "All our compute idle"}</b>
        <div class="bar${m.full ? " full" : ""}"><s style="width:${m.used * 100}%"></s></div></div>
        <button class="btn ${m.full ? "go" : "quiet"}">${m.full ? "Next ›" : "Queue a build ↓"}</button></div>`;
    },
  },
];

/** Each build's share of our Year 0 compute at its standard pace, alone. */
const NEED = Object.fromEntries(NAMES.map((n) => {
  const s = H.sharesAt({ builds: [n], observe: [] }, SCALE, 0);
  return [n, (s.parts[0]?.need ?? 0) / (1 - s.studies - s.fields)];
}));

const frames = [];
function build() {
  const main = document.getElementById("cards");
  VIEWS.forEach((v, i) => {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<div class="meta"><span class="num">0${i + 1}</span><span class="name">${v.name}</span></div><p class="note">${v.note}</p><div class="frame"></div>`;
    main.appendChild(card);
    const el = card.querySelector(".frame");
    el.addEventListener("click", (e) => {
      const pk = e.target.closest(".pk");
      if (!pk) return;
      toggle(pk.dataset.n);
    });
    frames.push({ v, el });
  });
}

function toggle(n) {
  const adding = !queue.includes(n);
  const e = H.moves({ builds: queue, observe: [] }, SCALE, n);
  queue = adding ? [...queue, n] : queue.filter((x) => x !== n);
  if (adding) {
    const mv = moveLine(e);
    last = `Adding ${the(n)}: done in ${span(e.at)}${mv ? `, and it ${mv}` : ", and it slows nothing else"}.`;
  } else {
    const out = [];
    if (e.late) out.push(`<span class="soon">${the(e.late.name)} finishes ${span(e.late.by)} sooner</span>`);
    if (e.soon) out.push(`<span class="late">${the(e.soon.name)} finishes ${span(e.soon.by)} later</span>`);
    last = `Without ${the(n)}, ${out.length ? out.join(", and ") : "nothing else moves"}.`;
  }
  draw();
}

function draw() {
  const m = model(queue);
  for (const f of frames) {
    const scroll = f.el.querySelector(".pn")?.scrollTop ?? 0;
    f.el.innerHTML = `${topBar(m)}<div class="pn"><div class="th"><span>BUILD</span><span>EXPLORE</span></div>${f.v.body(m)}</div>${f.v.foot ? f.v.footer(m) : ""}`;
    f.el.querySelector(".pn").scrollTop = scroll;
  }
}

document.querySelector(".ctl").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "mo") {
    motion = !motion;
    b.setAttribute("aria-pressed", String(motion));
    document.body.classList.toggle("still", !motion);
    return;
  }
  queue = [...PRESETS[b.dataset.q]];
  last = null;
  draw();
});
if (!motion) { document.body.classList.add("still"); document.getElementById("mo").setAttribute("aria-pressed", "false"); }

build();
draw();
</script>
</body>
</html>
